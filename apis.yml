aid: ancora-heart
name: Ancora Heart
description: 'Ancora Heart, Inc. is a privately held medical device company headquartered
  at 4001 Burton Drive, Santa Clara, California, developing transcatheter therapies
  for people living with heart failure. Its lead product is the AccuCinch Ventricular
  Restoration System, a completely transcatheter implant designed to reduce the size
  of an enlarged left ventricle and restore cardiac structure and function in patients
  with heart failure with reduced ejection fraction (HFrEF) who remain symptomatic
  on guideline-directed medical therapy. The device is investigational and is being
  evaluated in the CORCINCH-HF study (NCT04331769), a prospective randomized international
  trial enrolling up to 400 patients across as many as 80 centers, alongside the CORCINCH-EU
  program in Europe. Ancora Heart is a medical device manufacturer rather than a software
  company: it publishes a marketing and clinical-information website for patients and
  physicians, and operates no public developer program, API, or SDK.'
